[workspace]
resolver = "2"
members = ["crates/hetero-kv", "crates/hetero-kv-capi", "crates/hetero-kv-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
repository = "https://github.com/ai-computing/hetero-kv"
# License: not declared yet (see README "License").

[workspace.dependencies]
hetero-kv = { path = "crates/hetero-kv" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

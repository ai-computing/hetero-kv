[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hetero-kv-optimus"
version = "0.1.0"
description = "Optimus Prime (aicomp optimus-rm accel/pd) adapter for hetero-kv"
requires-python = ">=3.10"
dependencies = ["hetero-kv"]

[project.optional-dependencies]
torch = ["torch"]

[tool.setuptools]
packages = ["hetero_kv_optimus"]

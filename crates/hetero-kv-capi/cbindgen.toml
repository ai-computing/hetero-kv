language = "C"
include_guard = "HETERO_KV_H"
autogen_warning = "/* Generated by cbindgen from crates/hetero-kv-capi; do not edit. Regenerate with scripts/gen-header.sh. */"
header = "/* hetero-kv C ABI. See README.md and ARCHITECTURE.md. */"
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "type"
usize_is_size_t = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true

[enum]
prefix_with_name = false

[export]
include = ["hkv_progress_span"]
